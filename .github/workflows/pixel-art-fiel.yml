name: Publish faithful pixel art sprites

on:
  push:
    branches: [main]
    paths:
      - 'tools/pixel_art_fiel.py'
      - '.github/workflows/pixel-art-fiel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toonroyale-pixel-art-fiel
  cancel-in-progress: false

jobs:
  sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source assets
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependencies
        run: python -m pip install 'Pillow>=11,<13' 'numpy>=1.26,<3'
      - name: Generate faithful pixel art (same names and sizes)
        run: python tools/pixel_art_fiel.py
      - name: Check all generated images
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          source=Path('assets/img')
          target=Path('assets/pixel-art-fiel/img')
          inputs=sorted(source.rglob('*.png'))
          outputs=sorted(target.rglob('*.png'))
          assert len(inputs)==len(outputs)==176
          assert {p.relative_to(source) for p in inputs} == {p.relative_to(target) for p in outputs}
          for original in inputs:
              relative=original.relative_to(source)
              with Image.open(original) as x, Image.open(target/relative) as y:
                  x.load()
                  y.load()
                  assert x.size==y.size,relative
                  assert y.format=='PNG',relative
                  assert y.mode=='RGBA',relative
          report=json.loads(Path('assets/pixel-art-fiel/manifest.json').read_text())
          assert report['total']==176
          assert min(entry['shape_overlap'] for entry in report['files']) >= .88
          print('PASS all 176 sprites keep dimensions, original filenames, transparency and legibility')
          PY
      - name: Commit sprite files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pixel-art-fiel
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'assets: publish 176 faithful pixel-art PNG sprites'
            git push origin HEAD:main
          fi
