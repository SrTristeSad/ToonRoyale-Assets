name: Build Cute Pixel Art (176 sprites)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-pixel-art.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toonroyale-pixel-art
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install 'Pillow>=11,<13'

      - name: Verify and unpack source drawing scripts
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/pixel-art-source.tar.gz.b64 > /tmp/toonroyale-sources.tar.gz
          echo "c9343cbb1e79d88734f470d6cffb113248cb3df24b513b9a757fa28eddc2a3d3  /tmp/toonroyale-sources.tar.gz" | sha256sum -c -
          tar -tzf /tmp/toonroyale-sources.tar.gz | sort
          tar -xzf /tmp/toonroyale-sources.tar.gz -C .
          python -m py_compile tools/build_pixel_art.py tools/chibi_animals.py

      - name: Download pinned original source and prepare precisely 176 images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,io,pathlib,urllib.request,zipfile
          revision='06f7c1ca965a7628671676c8d9a7efd3997bb5e7'
          url=f'https://codeload.github.com/al007ex/moomoo-clone/zip/{revision}'
          req=urllib.request.Request(url,headers={'User-Agent':'ToonRoyale-Assets-ci'})
          with urllib.request.urlopen(req,timeout=90) as f:raw=f.read()
          prefix=f'moomoo-clone-{revision}/client/public/img/'
          excluded={
              'animals/boar_1.png','animals/crab_1.png','animals/yeti_1.png',
              'hats/hat_59.png','hats/hat_60.png','hats/hat_61.png'
          }
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              sources={}
              for p in z.namelist():
                  if p.startswith(prefix) and p.endswith('.png'):
                      rel=p[len(prefix):]
                      if rel not in excluded:
                          sources[rel]=z.read(p)
          assert len(sources)==176, f'Expected 176, got {len(sources)}'
          digest=hashlib.sha256()
          for p in sorted(sources):
              b=sources[p]
              digest.update(p.encode()+b'\0'+len(b).to_bytes(8,'big')+b)
          expected='49d8e6c29c0c2aee1dbdafcc67517bc6f36d0d7d0bd1c6a3902e3feb9e6c9e44'
          assert digest.hexdigest()==expected, 'Source bytes differ from user's verified ZIP'
          pathlib.Path('/tmp/toonroyale-input.zip').unlink(missing_ok=True)
          with zipfile.ZipFile('/tmp/toonroyale-input.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name,content in sources.items():z.writestr(name,content)
          print('Source integrity passed:',len(sources),'files')
          PY

      - name: Render original chibi pixel art and remaining equipment
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_pixel_art.py /tmp/toonroyale-input.zip assets/pixel-art/img
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('assets/pixel-art/img')
          paths=sorted(root.rglob('*.png'))
          assert len(paths)==176, len(paths)
          manifest=json.loads(Path('assets/pixel-art/pixel-art-manifest.json').read_text())
          assert manifest['pixel_art_sprites']==176
          for p in paths:
              with Image.open(p) as im:
                  im.verify()
                  assert im.format=='PNG', str(p)
          for key in ['bull_1.png','bull_2.png','wolf_1.png','wolf_2.png','enemy.png','sid.png','vince.png','pig_1.png']:
              assert (root/'animals'/key).exists(),key
          print('Validated:',len(paths),'real PNGs')
          PY

      - name: Commit independent pixel-art folder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pixel-art tools/build_pixel_art.py tools/chibi_animals.py
          if git diff --cached --quiet; then
            echo 'Pixel-art package already up to date'
          else
            git commit -m 'assets: add 176 cute pixel-art sprites with 14 original chibi creatures'
            git push origin HEAD:main
          fi
