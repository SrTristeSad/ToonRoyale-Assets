name: Testar equivalencia do movimento Lua (temporario)
on:
  push:
    paths:
      - '.github/workflows/temp-movement-parity.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Comparar Player.update original com o codigo Lua em 27 cenarios
        working-directory: windows atualização
        shell: bash
        run: |
          set -euo pipefail
          node server-lua/tests/movement-reference.mjs > /tmp/player-original.txt
          lua5.4 server-lua/tests/movement-reference.lua > /tmp/player-lua.txt
          diff -u /tmp/player-original.txt /tmp/player-lua.txt
          echo "PASS: $(wc -l < /tmp/player-original.txt) snapshots idênticos"
