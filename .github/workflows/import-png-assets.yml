name: Import and verify real PNG assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-png-assets.yml'
      - 'tools/import_assets.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toonroyale-png-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image converter
        run: python -m pip install 'Pillow>=11,<13'

      - name: Verify original archive and convert WebP to PNG
        run: python tools/import_assets.py

      - name: Commit verified images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img asset-manifest.json
          if git diff --cached --quiet; then
            echo "Assets already up-to-date"
          else
            git commit -m "assets: import 176 verified PNG images (8 converted)"
            git push origin HEAD:main
          fi
