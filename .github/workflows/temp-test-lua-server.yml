name: Teste temporario de paridade do servidor Lua
on:
  push:
    paths:
      - '.github/workflows/temp-test-lua-server.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua interpreter
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 lua-socket
      - name: Compare JS authoritative protocol with Lua port
        working-directory: windows atualização
        run: |
          node server-lua/tests/reference.mjs > server-lua/tests/reference-fixtures.txt
          lua5.4 server-lua/tests/protocol.lua server-lua/tests/reference-fixtures.txt
          lua5.4 server-lua/tests/websocket.lua
          lua5.4 server-lua/tests/host-smoke.lua > /tmp/lua-host-smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          python3 server-lua/tests/host-smoke.py
          cat /tmp/lua-host-smoke.log
