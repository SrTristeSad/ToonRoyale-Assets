name: Moo IO Android host - testes Lua
on:
  push:
    branches: [main, fix/android-tap-input-audit-v058]
    paths:
      - "android/**"
      - "windows atualização/server-lua/**"
      - ".github/workflows/android-host-tests.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-host-tests.yml"
  workflow_dispatch:
concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  host-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 lua-socket luajit
      - name: Verify Android Lua kernel mirrors Windows without replacing Android controls
        run: |
          set -eu
          test -s android/server-lua/local_server.lua
          test -s android/src/mobile/controls.lua
          cmp android/server-lua/local_server.lua "windows atualização/server-lua/local_server.lua"
          cmp android/server-lua/world/room_mods.lua "windows atualização/server-lua/world/room_mods.lua"
          cmp android/server-lua/world/map_profiles.lua "windows atualização/server-lua/world/map_profiles.lua"
          # Android menus and pause overlay implement touch-specific settings.
          # Authoritative server Lua and map/mod systems remain bit-for-bit synced.
          # The development-only regression fixtures are not shipped in the APK.
          mkdir -p android/server-lua/tests
          cp -a "windows atualização/server-lua/tests/." android/server-lua/tests/
          # SHA-1 blob IDs from SrTristeSad/Moo-IO main, Oct 25 2026.
          # Protect the exact mature mobile HUD + slot mapping from regressions.
          grep -F "FLOATING joysticks" android/src/mobile/controls.lua
          grep -F "function M:configure" android/src/mobile/controls.lua
          grep -F "function M:hotbar" android/src/mobile/controls.lua
          test "$(git hash-object android/src/mobile/slots.lua)" = "5771ba379ed185586afea66892e0256b692b2b7a"
      - name: Verificar host e cliente Android
        working-directory: android
        run: |
          set -e
          find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
          lua tests/android_host_test.lua
          lua tests/lua_thread_contract_test.lua
          # The Android LÖVE runtime is LuaJIT: validate its 5.1 grammar too.
          find server-lua -type f -name '*.lua' -print0 | xargs -0 -n1 sh -c 'luajit -b "$0" /dev/null'
          lua server-lua/tests/local-server-boot-smoke.lua
          lua server-lua/tests/map-mod-random-generation-smoke.lua
          mkdir -p "$RUNNER_TEMP/android-mod-data"
          MOO_IO_TEST_MOD_DATA_DIR="$RUNNER_TEMP/android-mod-data" lua server-lua/tests/mod-extra-mobs-smoke.lua
          lua server-lua/tests/life-persistence-smoke.lua
          lua tests/touch_controls_test.lua
          lua tests/mobile_editor_test.lua
          lua tests/mobile_input_audit_test.lua
          luajit tests/mobile_input_audit_test.lua
          luajit tests/mobile_editor_test.lua
          lua tests/mobile_resources_test.lua
          luajit tests/mobile_resources_test.lua
          lua tests/mobile_upgrade_position_test.lua
          luajit tests/mobile_upgrade_position_test.lua
          lua tests/mobile_single_hud_test.lua
          luajit tests/mobile_single_hud_test.lua
          lua tests/ability_actions_test.lua
          lua tests/latest_world_touch_test.lua
          luajit tests/latest_world_touch_test.lua
          lua tests/performance_test.lua
          lua tests/windows_core_port_test.lua
          lua tests/websocket_close_reason_test.lua
          lua tests/peer_isolation_test.lua
          luajit tests/peer_isolation_test.lua
          lua -e 'require("src.test_server_directory")()'
      - name: Android Lua client vs real authoritative Lua WebSocket (M -> C/D)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          export MOO_IO_BIND_IP=127.0.0.1
          export MOO_IO_ROOM_CODE=testing42
          export MOO_IO_NETWORK_MODE=lan
          export MOO_IO_E2E_PORT=18978
          export PORT=18978
          export MOO_IO_LUA_DATA_DIR="$RUNNER_TEMP/android-real-lua-server"
          mkdir -p "$MOO_IO_LUA_DATA_DIR"
          # Standalone Lua 5.4 has the same utf8 library used by the Android
          # LÖVE worker. The client is LuaJIT, matching the phone runtime.
          lua server-lua/run.lua >"$RUNNER_TEMP/android-real-lua-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 80); do
            if curl -fsS --max-time 1 "http://127.0.0.1:18978/ping" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/android-real-lua-server.log"
              exit 1
            fi
            sleep 0.1
          done
          curl -fsS --max-time 2 http://127.0.0.1:18978/ping >/dev/null
          if ! luajit tests/local_lua_real_client_e2e.lua; then
            echo 'SERVER LOG (secrets and tickets must not be logged):'
            tail -80 "$RUNNER_TEMP/android-real-lua-server.log"
            exit 1
          fi

