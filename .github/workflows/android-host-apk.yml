name: ToonRoyale Moo-IO Android - APK servidor Lua
on:
  push:
    branches: [main, android-port-windows-lua-core-preserve-touch, feat/android-floating-hud-windows-lua]
    paths:
      - "android/**"
      - "windows atualização/server-lua/**"
      - "windows atualização/src/**"
      - ".github/workflows/android-host-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "windows atualização/server-lua/**"
      - "windows atualização/src/**"
      - ".github/workflows/android-host-apk.yml"
  workflow_dispatch:
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  standalone-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare official LÖVE Android 11.5a
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules --depth 1 --branch 11.5a https://github.com/love2d/love-android.git "$RUNNER_TEMP/love-android"
          git -C "$RUNNER_TEMP/love-android" rev-parse HEAD | grep -qi '^55feb38'
          engine="$RUNNER_TEMP/love-android"
          sed -i '/^app.name_byte_array=/d' "$engine/gradle.properties"
          sed -i 's/^#app.name=.*/app.name=Moo IO Beta/' "$engine/gradle.properties"
          sed -i 's/^app.application_id=.*/app.application_id=io.srtristesad.mooio.beta/' "$engine/gradle.properties"
          sed -i 's/^app.version_code=.*/app.version_code=7/' "$engine/gradle.properties"
          sed -i 's/^app.version_name=.*/app.version_name=0.5.3-lua-floating-hud/' "$engine/gradle.properties"
          sed -i 's/^app.orientation=.*/app.orientation=landscape/' "$engine/gradle.properties"
          game="$engine/app/src/embed/assets"
          mkdir -p "$game"
          cp android/main.lua android/conf.lua "$game/"
          cp -a android/src android/assets "$game/"
          # Android now owns a versioned copy of the Windows Lua core.
          # Never substitute a hidden Node or staging server at build time.
          cp -a android/server-lua "$game/server-lua"
          rm -rf "$game/server-lua/tests"
          test -s android/src/mobile/controls.lua
          test -s "$game/src/mobile/controls.lua"
          test -s "$game/src/mobile/slots.lua"
          test -s "$game/src/game/reference_view.lua"
          grep -F 'function View.touchInteraction' "$game/src/game/reference_view.lua"
          grep -F 'function love.touchpressed(id,x,y)' "$game/main.lua"
          test -s "$game/src/game/mooio_home.lua"
          test -s "$game/src/game/pc_menu_style.lua"
          test -s "$game/server-lua/world/map_dependencies.lua"
          test -s "$game/server-lua/world/mod_creatures.lua"
          test -s "$game/server-lua/world/life_persistence.lua"
          test -s "$game/server-lua/local_server.lua"
          test -s "$game/server-lua/world/room_mods.lua"
          sed -i 's/org.love2d.android.GameActivity/org.love2d.android.MooIOActivity/' "$engine/app/src/main/AndroidManifest.xml"
          # The Windows Lua server runs in a separate LÖVE thread.
          # No Android foreground Node service, libnode or custom CMake build.
          test -f "$engine/app/src/main/AndroidManifest.xml"
          mkdir -p "$engine/app/src/main/java/org/love2d/android"
          cp android/native/MooIOActivity.java android/native/MooIOTlsBridge.java "$engine/app/src/main/java/org/love2d/android/"
      - name: Stable beta signing when GitHub secrets are configured
        shell: bash
        env:
          MOOIO_BETA_KEYSTORE_B64: ${{ secrets.MOOIO_BETA_KEYSTORE_B64 }}
          MOOIO_BETA_STORE_PASS: ${{ secrets.MOOIO_BETA_STORE_PASS }}
          MOOIO_BETA_KEY_ALIAS: ${{ secrets.MOOIO_BETA_KEY_ALIAS }}
          MOOIO_BETA_KEY_PASS: ${{ secrets.MOOIO_BETA_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -n "${MOOIO_BETA_KEYSTORE_B64}" ]; then
            test -n "${MOOIO_BETA_STORE_PASS}"
            test -n "${MOOIO_BETA_KEY_ALIAS}"
            test -n "${MOOIO_BETA_KEY_PASS}"
            printf '%s' "${MOOIO_BETA_KEYSTORE_B64}" | base64 --decode > "$RUNNER_TEMP/mooio-beta.jks"
            chmod 600 "$RUNNER_TEMP/mooio-beta.jks"
            echo "MOOIO_BETA_KEYSTORE_PATH=$RUNNER_TEMP/mooio-beta.jks" >> "$GITHUB_ENV"
            echo "MOOIO_BETA_STORE_PASSWORD=$MOOIO_BETA_STORE_PASS" >> "$GITHUB_ENV"
            echo "MOOIO_BETA_ALIAS=$MOOIO_BETA_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MOOIO_BETA_KEY_PASSWORD=$MOOIO_BETA_KEY_PASS" >> "$GITHUB_ENV"
            cat >> "$RUNNER_TEMP/love-android/app/build.gradle" <<'GRADLE'
          android {
              signingConfigs {
                  mooioBeta {
                      storeFile file(System.getenv('MOOIO_BETA_KEYSTORE_PATH'))
                      storePassword System.getenv('MOOIO_BETA_STORE_PASSWORD')
                      keyAlias System.getenv('MOOIO_BETA_ALIAS')
                      keyPassword System.getenv('MOOIO_BETA_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.mooioBeta }
              }
          }
          GRADLE
          else
            echo "BETA_SIGNING_EPHEMERAL: Android SDK debug cert changes per workflow."
            echo "Beta uses separate app ID so it can be installed alongside legacy APKs."
          fi
      - name: Compile standalone Android APK (ARM64 and emulator)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/love-android"
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" assembleEmbedNoRecordDebug --stacktrace
      - name: Verify packaged game, real Lua server and APK signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find "$RUNNER_TEMP/love-android/app/build/outputs/apk" -name '*embed*debug*.apk' | head -1)
          test -s "$apk"
          cp "$apk" dist/Moo-IO-Android-Beta-Instalavel.apk
          unzip -l dist/Moo-IO-Android-Beta-Instalavel.apk > "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/main.lua' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/src/mobile/lua_host_thread.lua' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/server-lua/local_server.lua' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/server-lua/world/room_mods.lua' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/server-lua/world/map_profiles.lua' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/server-lua/maps/bunker-e-cavernas.json' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/server-lua/mods/lobos-em-matilha.json' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/server-lua/mods/novas-especies.json' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/server-lua/maps/cabana-e-mina.json' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/src/game/pc_menu_style.lua' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/src/mobile/controls.lua' "$RUNNER_TEMP/apk-files.txt"
          unzip -p dist/Moo-IO-Android-Beta-Instalavel.apk assets/src/mobile/controls.lua | grep -F 'function M:attackJoystick'
          unzip -p dist/Moo-IO-Android-Beta-Instalavel.apk assets/src/mobile/controls.lua | grep -F 'function M:pressed'
          unzip -p dist/Moo-IO-Android-Beta-Instalavel.apk assets/src/mobile/controls.lua | grep -F 'function M:hotbar'
          unzip -p dist/Moo-IO-Android-Beta-Instalavel.apk assets/main.lua | grep -F 'saveHudSettings'
          ! grep -Eq 'assets/mooio-server.zip|libnode.so|libmooiohost.so' "$RUNNER_TEMP/apk-files.txt"
          unzip -p dist/Moo-IO-Android-Beta-Instalavel.apk assets/src/mobile/lua_host_thread.lua | grep -F 'require("server-lua.local_server")'
          unzip -p dist/Moo-IO-Android-Beta-Instalavel.apk assets/src/net/mooio_host.lua | grep -F 'love.thread.newThread'
          ! unzip -p dist/Moo-IO-Android-Beta-Instalavel.apk assets/main.lua | grep -F 'MooIONodeBridge'
          sdk_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$sdk_tools/apksigner"
          test -x "$sdk_tools/aapt"
          "$sdk_tools/apksigner" verify --verbose dist/Moo-IO-Android-Beta-Instalavel.apk
          "$sdk_tools/aapt" dump badging dist/Moo-IO-Android-Beta-Instalavel.apk | grep -F "package: name='io.srtristesad.mooio.beta'"
          "$sdk_tools/aapt" dump badging dist/Moo-IO-Android-Beta-Instalavel.apk | grep -F "launchable-activity: name='org.love2d.android.MooIOActivity'"
          keytool -printcert -jarfile dist/Moo-IO-Android-Beta-Instalavel.apk | grep 'SHA256:'
      - uses: actions/upload-artifact@v4
        with:
          name: Moo-IO-Android-Beta-Instalavel
          path: dist/Moo-IO-Android-Beta-Instalavel.apk
          retention-days: 30
          if-no-files-found: error
