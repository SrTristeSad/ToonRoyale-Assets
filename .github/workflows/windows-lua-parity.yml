name: Windows - Paridade do servidor Lua
on:
  push:
    branches: [main]
    paths:
      - 'windows atualização/server-lua/**'
      - 'windows atualização/src/game/config.lua'
      - 'windows atualização/server/src/moomoo/**'
      - 'windows atualização/server/src/protocol/**'
      - 'windows atualização/shared/config.js'
      - 'windows atualização/shared/config/items.js'
      - '.github/workflows/windows-lua-parity.yml'
  pull_request:
    paths:
      - 'windows atualização/server-lua/**'
      - 'windows atualização/src/game/config.lua'
      - 'windows atualização/server/src/moomoo/**'
      - 'windows atualização/server/src/protocol/**'
      - 'windows atualização/shared/config.js'
      - 'windows atualização/shared/config/items.js'
      - '.github/workflows/windows-lua-parity.yml'
permissions:
  contents: read
jobs:
  differential:
    name: Node original vs Lua - testes reais
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: windows atualização
        shell: bash
    steps:
      - name: Checkout da cópia
        uses: actions/checkout@v4
      - name: Instalar Lua e LuaSocket
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 lua-socket
      - name: Protocolo de rede, criptografia e WebSocket
        run: |
          set -euo pipefail
          node server-lua/tests/reference.mjs > /tmp/moo-lua-protocol.txt
          lua5.4 server-lua/tests/protocol.lua /tmp/moo-lua-protocol.txt
          lua5.4 server-lua/tests/websocket.lua
      - name: Mundo completo (semente replicável)
        run: |
          set -euo pipefail
          for seed in 1 42 12345 4294967295; do
            node server-lua/tests/world-reference.mjs "$seed" > /tmp/moo-world-node.txt
            lua5.4 server-lua/tests/world-reference.lua "$seed" > /tmp/moo-world-lua.txt
            diff -u /tmp/moo-world-node.txt /tmp/moo-world-lua.txt
            echo "PASS seed=$seed"
          done
      - name: Colisões, bordas e biomas
        run: |
          set -euo pipefail
          node server-lua/tests/collision-reference.mjs > /tmp/moo-collision-node.txt
          lua5.4 server-lua/tests/collision-reference.lua > /tmp/moo-collision-lua.txt
          diff -u /tmp/moo-collision-node.txt /tmp/moo-collision-lua.txt
          node server-lua/tests/environment-reference.mjs > /tmp/moo-env-node.txt
          lua5.4 server-lua/tests/environment-reference.lua > /tmp/moo-env-lua.txt
          diff -u /tmp/moo-env-node.txt /tmp/moo-env-lua.txt
      - name: Movimento Player.update do Node vs Lua (81 snapshots)
        run: |
          set -euo pipefail
          node server-lua/tests/movement-reference.mjs > /tmp/moo-movement-node.txt
          lua5.4 server-lua/tests/movement-reference.lua > /tmp/moo-movement-lua.txt
          diff -u /tmp/moo-movement-node.txt /tmp/moo-movement-lua.txt
          test "$(wc -l < /tmp/moo-movement-node.txt)" -eq 81
          echo 'PASS 81 snapshots'
      - name: Vida animal real integrada ao motor da sala Lua
        run: |
          set -euo pipefail
          lua5.4 server-lua/tests/animals-health-smoke.lua
      - name: Vida morte e recompensas de animais Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/animal-health-reference.mjs > /tmp/moo-animalhealth-node.txt
          lua5.4 server-lua/tests/animal-health-reference.lua > /tmp/moo-animalhealth-lua.txt
          diff -u /tmp/moo-animalhealth-node.txt /tmp/moo-animalhealth-lua.txt
          test "$(wc -l < /tmp/moo-animalhealth-node.txt)" -eq 19
          echo 'PASS 19 cenarios de vida e recompensas animais'
      - name: Animal types spawn e planos de populacao Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/animal-manager-reference.mjs > /tmp/moo-animalmanager-node.txt
          lua5.4 server-lua/tests/animal-manager-reference.lua > /tmp/moo-animalmanager-lua.txt
          diff -u /tmp/moo-animalmanager-node.txt /tmp/moo-animalmanager-lua.txt
          test "$(grep -c '^TYPE|' /tmp/moo-animalmanager-node.txt)" -eq 15
          echo 'PASS 15 tipos e posicionamento dos animais'
      - name: IA dos animais comuns Node vs Lua (60 snapshots)
        run: |
          set -euo pipefail
          node server-lua/tests/ai-reference.mjs > /tmp/moo-ai-node.txt
          lua5.4 server-lua/tests/ai-reference.lua > /tmp/moo-ai-lua.txt
          diff -u /tmp/moo-ai-node.txt /tmp/moo-ai-lua.txt
          test "$(wc -l < /tmp/moo-ai-node.txt)" -eq 60
          echo 'PASS 60 snapshots da IA comum'
      - name: Animais minimapa lideres ranking e estatisticas Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/social-reference.mjs > /tmp/moo-social-node.txt
          lua5.4 server-lua/tests/social-reference.lua > /tmp/moo-social-lua.txt
          diff -u /tmp/moo-social-node.txt /tmp/moo-social-lua.txt
          test "$(wc -l < /tmp/moo-social-node.txt)" -eq 12
          echo "PASS 12 snapshots dos servicos Game de animais e ranking"
      - name: Entrada cliente e marcacoes do mapa Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/input-reference.mjs > /tmp/moo-input-node.txt
          lua5.4 server-lua/tests/input-reference.lua > /tmp/moo-input-lua.txt
          diff -u /tmp/moo-input-node.txt /tmp/moo-input-lua.txt
          test "$(wc -l < /tmp/moo-input-node.txt)" -eq 33
          echo "PASS 33 cenarios de pacotes gameplay comparados com Node"
      - name: Transporte Host para Room com sessão e Player real obrigatório
        run: |
          set -euo pipefail
          lua5.4 server-lua/tests/room-transport-smoke.lua
      - name: Sala com AI nativa e bloqueio de Crab King incompleto
        run: |
          set -euo pipefail
          lua5.4 server-lua/tests/room-animals-smoke.lua
      - name: Sala Lua integrada - Player Projectile Structures Snapshots
        run: |
          set -euo pipefail
          lua5.4 server-lua/tests/room-smoke.lua
      - name: Player.update integral - efeitos movimento armas Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/player-update-reference.mjs > /tmp/moo-playerupdate-node.txt
          lua5.4 server-lua/tests/player-update-reference.lua > /tmp/moo-playerupdate-lua.txt
          diff -u /tmp/moo-playerupdate-node.txt /tmp/moo-playerupdate-lua.txt
          test "$(wc -l < /tmp/moo-playerupdate-node.txt)" -eq 54
          echo "PASS 54 atualizacoes completas de Player.update"
      - name: Motor principal e agenda Game.tick do Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/game-loop-reference.mjs > /tmp/moo-loop-node.txt
          lua5.4 server-lua/tests/game-loop-reference.lua > /tmp/moo-loop-lua.txt
          diff -u /tmp/moo-loop-node.txt /tmp/moo-loop-lua.txt
          test "$(wc -l < /tmp/moo-loop-node.txt)" -eq 24
          echo "PASS 24 ticks integrais do agendador autoritativo"
      - name: Torretas e animacao de construcoes - Game Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/structures-reference.mjs > /tmp/moo-structures-node.txt
          lua5.4 server-lua/tests/structures-reference.lua > /tmp/moo-structures-lua.txt
          diff -u /tmp/moo-structures-node.txt /tmp/moo-structures-lua.txt
          test "$(wc -l < /tmp/moo-structures-node.txt)" -eq 60
          echo "PASS 60 snapshots de torretas e estruturas"
      - name: Fisica dos projeteis e colisoes - Projectile Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/projectile-reference.mjs > /tmp/moo-projectile-node.txt
          lua5.4 server-lua/tests/projectile-reference.lua > /tmp/moo-projectile-lua.txt
          diff -u /tmp/moo-projectile-node.txt /tmp/moo-projectile-lua.txt
          test "$(wc -l < /tmp/moo-projectile-node.txt)" -eq 60
          echo "PASS 60 snapshots de projeteis"
      - name: Construcao estruturas e consumo - Player.buildItem Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/build-reference.mjs > /tmp/moo-build-node.txt
          lua5.4 server-lua/tests/build-reference.lua > /tmp/moo-build-lua.txt
          diff -u /tmp/moo-build-node.txt /tmp/moo-build-lua.txt
          test "$(wc -l < /tmp/moo-build-node.txt)" -eq 16
          echo "PASS 16 cenarios de construcao"
      - name: Coleta e combate corpo a corpo - Player.gather Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/gather-reference.mjs > /tmp/moo-gather-node.txt
          lua5.4 server-lua/tests/gather-reference.lua > /tmp/moo-gather-lua.txt
          diff -u /tmp/moo-gather-node.txt /tmp/moo-gather-lua.txt
          test "$(wc -l < /tmp/moo-gather-node.txt)" -eq 36
          echo "PASS 36 cenarios de coleta e melee"
      - name: Armas recarga e projeteis - Player.update Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/weapon-reference.mjs > /tmp/moo-weapon-node.txt
          lua5.4 server-lua/tests/weapon-reference.lua > /tmp/moo-weapon-lua.txt
          diff -u /tmp/moo-weapon-node.txt /tmp/moo-weapon-lua.txt
          test "$(wc -l < /tmp/moo-weapon-node.txt)" -eq 45
          echo "PASS 45 ticks de armas e recarga"
      - name: Economia recursos e experiencia Node vs Lua (19 cenarios)
        run: |
          set -euo pipefail
          node server-lua/tests/economy-reference.mjs > /tmp/moo-econ-node.txt
          lua5.4 server-lua/tests/economy-reference.lua > /tmp/moo-econ-lua.txt
          diff -u /tmp/moo-econ-node.txt /tmp/moo-econ-lua.txt
          test "$(wc -l < /tmp/moo-econ-node.txt)" -eq 19
          echo 'PASS 19 cenarios de economia e XP'
      - name: Vida dano morte e recompensas Node vs Lua (16 cenarios)
        run: |
          set -euo pipefail
          node server-lua/tests/health-reference.mjs > /tmp/moo-health-node.txt
          lua5.4 server-lua/tests/health-reference.lua > /tmp/moo-health-lua.txt
          diff -u /tmp/moo-health-node.txt /tmp/moo-health-lua.txt
          test "$(wc -l < /tmp/moo-health-node.txt)" -eq 16
          echo 'PASS 16 cenarios de vida morte e recompensa'
      - name: Regeneracao e efeitos periodicos Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/vitals-reference.mjs > /tmp/moo-vitals-node.txt
          lua5.4 server-lua/tests/vitals-reference.lua > /tmp/moo-vitals-lua.txt
          diff -u /tmp/moo-vitals-node.txt /tmp/moo-vitals-lua.txt
          echo 'PASS regeneracao, veneno, vergonha e renda dos moinhos'
      - name: Spawn, recursos e pontos de respawn Player Node vs Lua
        run: |
          set -euo pipefail
          node server-lua/tests/spawn-reference.mjs > /tmp/moo-spawn-node.txt
          lua5.4 server-lua/tests/spawn-reference.lua > /tmp/moo-spawn-lua.txt
          diff -u /tmp/moo-spawn-node.txt /tmp/moo-spawn-lua.txt
          test "$(wc -l < /tmp/moo-spawn-node.txt)" -eq 8
          echo 'PASS 8 cenarios de spawn e respawn'
      - name: Snapshots de jogadores e objetos (pacotes D, a, H)
        run: |
          set -euo pipefail
          node server-lua/tests/snapshot-reference.mjs > /tmp/moo-sync-node.txt
          lua5.4 server-lua/tests/snapshot-reference.lua > /tmp/moo-sync-lua.txt
          diff -u /tmp/moo-sync-node.txt /tmp/moo-sync-lua.txt
          echo 'PASS snapshots de jogadores e objetos'
      - name: Servidor de rede LuaSocket de verdade
        run: |
          set -euo pipefail
          lua5.4 server-lua/tests/host-smoke.lua >/tmp/moo-host-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 1
          python3 server-lua/tests/host-smoke.py
          cat /tmp/moo-host-smoke.log
